name: Rename game file to index.html
on:
  push:
    paths:
      - .github/workflows/rename-to-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          if [ -f "wu-xian-rou-ge-phone.html" ] && [ ! -f "index.html" ]; then
            SRC="wu-xian-rou-ge-phone.html"
          elif [ -f "wu-xian-rou-ge-phone-v6.html" ] && [ ! -f "index.html" ]; then
            SRC="wu-xian-rou-ge-phone-v6.html"
          else
            echo "Nothing to rename"
            exit 0
          fi
          git config user.name "hewenzhou726"
          git config user.email "hewenzhou726@users.noreply.github.com"
          git mv "$SRC" index.html
          git commit -m "Rename $SRC to index.html"
          git push
